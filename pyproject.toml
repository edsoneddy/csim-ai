[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csim-ai"
version = "0.0.3"
description = "Neural-augmented Python code plagiarism detection for programming judges."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Edson Eddy", email = "crew0eddy@gmail.com" }]
keywords = ["plagiarism detection", "code similarity", "bi-encoder", "onnx", "programming judges"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["numpy>=1.24", "onnxruntime>=1.20", "tokenizers>=0.20", "huggingface_hub>=0.25"]

[project.urls]
Homepage = "https://github.com/edsoneddy/csim-ai"
"Source Code" = "https://github.com/edsoneddy/csim-ai"
"Bug Tracker" = "https://github.com/edsoneddy/csim-ai/issues"
Documentation = "https://github.com/edsoneddy/csim-ai#readme"

[project.scripts]
csim-ai = "csim_ai.cli:main"

[project.optional-dependencies]
# NOTE: csim>=3.3.0 pins numpy==1.26.4 exactly. Looked like it coexisted
# fine with the rest of the stack (numpy>=2.0) in Fase 4's dev venv --
# but that venv already had numpy 2.5.2 installed before csim was added,
# so pip never had to actually *resolve* the exact pin against the rest
# in one shot. A genuinely clean `pip install csim-ai[ast,scorer]`
# (0.0.1, published) hit pip's strict resolver and failed outright:
# ResolutionImpossible, numpy>=2.0 (this package) vs. numpy==1.26.4
# (csim). Fixed in 0.0.2 by dropping the artificial numpy>=2.0 floor to
# numpy>=1.24 -- nothing in this dependency tree actually needs 2.0
# (onnxruntime>=1.21.6, transformers>=1.17, scikit-learn/
# sentence-transformers>=1.24, torch has no floor at all), so
# numpy==1.26.4 now satisfies everyone and pip resolves cleanly.
# A second, related bug this surfaced: `fusion_model_v1.joblib` had been
# pickled under numpy 2.5.2, and joblib/pickle's numpy RandomState/
# BitGenerator format isn't backward-compatible -- loading it under
# numpy 1.26.4 raised `ValueError: ... PCG64 is not a known BitGenerator
# module`. Fixed by retraining/repickling the fusion model under numpy
# 1.26.4 specifically (verified to load correctly under *both* 1.26.4
# and 2.5.2 afterward -- numpy's forward compat direction, not
# backward). Any future retrain of the fusion model must be pickled
# under the oldest supported numpy, not whatever's in the dev venv.
ast = ["csim>=3.3.0"]   # optional TED signal via the csim package (Etapa B feature)
train = ["pyyaml>=6.0", "csim>=3.3.0", "libcst>=1.0"]
torch = ["torch>=2.9", "transformers>=5.0", "sentence-transformers>=3.0"]  # zero-shot eval (Fase 2), fine-tuning (Fase 3+)
scorer = ["scikit-learn>=1.5", "joblib>=1.3"]  # GBDT fusion scorer (Fase 4)
export = ["onnx>=1.15", "torch>=2.9", "transformers>=5.0"]  # `csim-ai setup --export-from` / training/export_onnx.py -- not needed for inference
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/csim_ai"]

[tool.hatch.build.targets.sdist]
# Allowlist, not a denylist -- hatchling's default sdist walks the whole
# repo (not just git-tracked files), which pulled in training/'s
# research artifacts and even .claude/ session state on a first build.
# Keep the sdist scoped to what's actually needed to build the wheel +
# the files PyPI expects (README/LICENSE), same as the wheel's own
# "lean base install" scope -- docs/ and training/ stay on GitHub only.
include = [
    "src/csim_ai",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
