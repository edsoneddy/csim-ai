[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csim-ai"
version = "0.0.1"
description = "Neural-augmented Python code plagiarism detection for programming judges."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Edsone Eddy", email = "crew0eddy@gmail.com" }]
# Base install stays free of heavy deps (no torch). Real runtime deps
# (onnxruntime, numpy, tokenizers) land here once src/csim_ai has an
# inference path to run (Fase 5).
dependencies = []

[project.optional-dependencies]
# NOTE: [ast] and [torch] conflict in the same venv -- csim pins
# numpy==1.26.4 exactly, torch/transformers/sentence-transformers need
# numpy>=2.0. Fine for now (different phases use different extras
# sequentially), but needs a real fix before Fase 5 packaging if both
# are ever needed at once (e.g. csim's TED as an Etapa B feature inside
# a torch-based scorer).
ast = ["csim>=3.3.0"]   # optional TED signal via the csim package (Etapa B feature)
train = ["pyyaml>=6.0", "csim>=3.3.0", "libcst>=1.0"]
torch = ["torch>=2.9", "transformers>=5.0", "sentence-transformers>=3.0"]  # zero-shot eval (Fase 2), fine-tuning (Fase 3+)

[tool.hatch.build.targets.wheel]
packages = ["src/csim_ai"]
