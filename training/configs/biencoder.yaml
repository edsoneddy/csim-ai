# Fase 3 bi-encoder contrastive fine-tune. Keep in sync with
# training/train_biencoder.py.
seed: 42

lr: 2.0e-5
warmup_steps: 100
max_steps: 1500
n_problems_per_batch: 10   # ~18 (anchor, positive) pairs/batch in practice
# NOTE: 16 caused intermittent CUDA OOM on the 8GB 3060 Ti (a batch that
# happens to sample a long submission pads everything in it up, and two
# full fp32 forward passes -- anchor and positive -- are kept alive at
# once for the backward pass). 10 was clean across a 15-step smoke test.
temperature: 0.07
max_length: 512

log_every: 20
eval_every: 150
